<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraExam - My Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Plus Jakarta Sans','system-ui','sans-serif']}}}}</script>
    <script src="/src/utils/security.js"></script>
    <script src="/src/utils/notification-bell.js"></script>
    <script>
        if (typeof SecurityGuard !== 'undefined') SecurityGuard.protectPage('student');
    </script>
</head>
<body class="flex h-screen overflow-hidden font-sans" style="background:#F8F7F4;color:#111111;">

    <!-- Sidebar -->
    <aside class="w-64 flex flex-col hidden md:flex flex-shrink-0" style="background:#111111;">
        <div class="h-16 flex items-center px-4" style="border-bottom:1px solid rgba(255,255,255,0.07);">
            <img src="/src/assets/logo.png" alt="AuraExam" class="h-8 w-auto">
        </div>

        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-0.5">
            <a href="/src/views/student-dashboard.html" class="flex items-center px-3 py-2.5 text-sm font-medium rounded transition-colors" style="color:rgba(255,255,255,0.5);" onmouseover="this.style.background='rgba(255,255,255,0.07)';this.style.color='#fff'" onmouseout="this.style.background='transparent';this.style.color='rgba(255,255,255,0.5)'">
                <svg class="w-4 h-4 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                Dashboard
            </a>
            <a href="/src/views/student-exams.html" class="flex items-center px-3 py-2.5 text-sm font-medium rounded transition-colors" style="color:rgba(255,255,255,0.5);" onmouseover="this.style.background='rgba(255,255,255,0.07)';this.style.color='#fff'" onmouseout="this.style.background='transparent';this.style.color='rgba(255,255,255,0.5)'">
                <svg class="w-4 h-4 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                My Exams
            </a>
            <a href="/src/views/student-grades.html" class="flex items-center px-3 py-2.5 text-sm font-medium rounded transition-colors" style="color:rgba(255,255,255,0.5);" onmouseover="this.style.background='rgba(255,255,255,0.07)';this.style.color='#fff'" onmouseout="this.style.background='transparent';this.style.color='rgba(255,255,255,0.5)'">
                <svg class="w-4 h-4 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                My Grades
            </a>
            <a href="/src/views/student-profile.html" class="flex items-center px-3 py-2.5 text-sm font-semibold text-white rounded transition-colors" style="background:rgba(255,255,255,0.1);">
                <svg class="w-4 h-4 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                My Profile
            </a>
            <a href="/src/views/student-notes.html" class="flex items-center px-3 py-2.5 text-sm font-medium rounded transition-colors" style="color:rgba(255,255,255,0.5);" onmouseover="this.style.background='rgba(255,255,255,0.07)';this.style.color='#fff'" onmouseout="this.style.background='transparent';this.style.color='rgba(255,255,255,0.5)'">
                <svg class="w-4 h-4 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                My Notes
            </a>
        </nav>

        <div class="p-3" style="border-top:1px solid rgba(255,255,255,0.07);">
            <button onclick="if(typeof SecurityGuard!=='undefined') SecurityGuard.logout()" class="flex items-center w-full px-3 py-2.5 text-sm font-medium rounded transition-colors" style="color:rgba(255,255,255,0.4);" onmouseover="this.style.background='rgba(255,255,255,0.07)';this.style.color='#fca5a5'" onmouseout="this.style.background='transparent';this.style.color='rgba(255,255,255,0.4)'">
                <svg class="w-4 h-4 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Log Out
            </button>
        </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <header class="h-16 flex items-center justify-between px-8 flex-shrink-0" style="background:#fff;border-bottom:1px solid #E5E1DA;">
            <h2 class="text-sm font-bold uppercase tracking-widest" style="color:#8A8A8A;">My Profile</h2>
            <div class="flex items-center gap-3">
                <div class="relative">
                    <button id="bell-btn" onclick="toggleBellDropdown()" class="relative w-9 h-9 flex items-center justify-center rounded-full transition-colors" style="background:transparent;border:none;cursor:pointer;" onmouseover="this.style.background='#F8F7F4'" onmouseout="this.style.background='transparent'">
                        <svg class="w-5 h-5" style="color:#8A8A8A;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                        <span id="bell-badge" class="hidden absolute top-1 right-1 w-4 h-4 text-[10px] font-bold text-white flex items-center justify-center rounded-full" style="background:#DC2626;"></span>
                    </button>
                    <div id="bell-dropdown" class="hidden absolute right-0 mt-1 w-80 bg-white rounded-lg shadow-xl z-50" style="border:1px solid #E5E1DA;top:100%;"></div>
                </div>
                <p id="user-name-header" class="text-sm font-bold" style="color:#111111;">Loading...</p>
                <img id="user-avatar-header" class="w-9 h-9 rounded-full" style="border:2px solid #E5E1DA;" src="" alt="Avatar">
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-8" style="background:#F8F7F4;">
            <div class="max-w-2xl mx-auto space-y-6">

                <!-- Profile Info Card -->
                <div class="bg-white rounded overflow-hidden" style="border:1px solid #E5E1DA;">
                    <div class="px-6 py-4" style="border-bottom:1px solid #E5E1DA;">
                        <h3 class="font-bold text-sm" style="color:#111111;">Account Information</h3>
                    </div>
                    <div class="p-6 flex items-center gap-6">
                        <img id="profile-avatar" class="w-20 h-20 rounded-full" style="border:3px solid #E5E1DA;" src="" alt="Avatar">
                        <div>
                            <p id="profile-name" class="text-xl font-black" style="color:#111111;">—</p>
                            <p id="profile-email" class="text-sm mt-0.5" style="color:#8A8A8A;">—</p>
                            <span id="profile-role" class="mt-2 inline-block px-2.5 py-0.5 text-xs font-bold rounded uppercase tracking-wider" style="background:#EEF0F6;color:#1D3461;">—</span>
                        </div>
                    </div>
                </div>

                <!-- Change Password Card -->
                <div class="bg-white rounded overflow-hidden" style="border:1px solid #E5E1DA;">
                    <div class="px-6 py-4" style="border-bottom:1px solid #E5E1DA;">
                        <h3 class="font-bold text-sm" style="color:#111111;">Change Password</h3>
                    </div>
                    <form id="form-change-password" class="p-6 space-y-4">
                        <div id="pw-alert" class="hidden px-4 py-3 rounded text-sm font-medium" style="border-radius:4px;"></div>
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-widest mb-1.5" style="color:#8A8A8A;">Current Password</label>
                            <input type="password" id="pw-current" required placeholder="Enter current password" class="w-full px-4 py-2.5 text-sm outline-none transition-all" style="border:1px solid #E5E1DA;border-radius:4px;background:#fff;color:#111111;font-family:inherit;" onfocus="this.style.borderColor='#1D3461';this.style.boxShadow='0 0 0 3px rgba(29,52,97,0.08)'" onblur="this.style.borderColor='#E5E1DA';this.style.boxShadow='none'">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-widest mb-1.5" style="color:#8A8A8A;">New Password</label>
                            <input type="password" id="pw-new" required minlength="8" placeholder="At least 8 characters" class="w-full px-4 py-2.5 text-sm outline-none transition-all" style="border:1px solid #E5E1DA;border-radius:4px;background:#fff;color:#111111;font-family:inherit;" onfocus="this.style.borderColor='#1D3461';this.style.boxShadow='0 0 0 3px rgba(29,52,97,0.08)'" onblur="this.style.borderColor='#E5E1DA';this.style.boxShadow='none'">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-widest mb-1.5" style="color:#8A8A8A;">Confirm New Password</label>
                            <input type="password" id="pw-confirm" required minlength="8" placeholder="Repeat new password" class="w-full px-4 py-2.5 text-sm outline-none transition-all" style="border:1px solid #E5E1DA;border-radius:4px;background:#fff;color:#111111;font-family:inherit;" onfocus="this.style.borderColor='#1D3461';this.style.boxShadow='0 0 0 3px rgba(29,52,97,0.08)'" onblur="this.style.borderColor='#E5E1DA';this.style.boxShadow='none'">
                        </div>
                        <button type="submit" id="btn-change-pw" class="w-full py-3 text-white font-bold rounded text-sm transition-colors" style="background:#111111;border:none;cursor:pointer;border-radius:4px;" onmouseover="this.style.background='#1D3461'" onmouseout="this.style.background='#111111'">
                            Update Password
                        </button>
                    </form>
                </div>

            </div>
        </main>
    </div>

    <script>
        const API_BASE = '/api';

        async function initPage() {
            const session = typeof SecurityGuard !== 'undefined' ? SecurityGuard.getSession() : null;
            if (!session) return;

            const name = session.name || session.email.split('@')[0];
            const avatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=1D3461&color=fff`;

            document.getElementById('user-name-header').innerText = name;
            document.getElementById('user-avatar-header').src = avatarUrl;
            if (typeof initNotificationBell !== 'undefined') initNotificationBell();
            document.getElementById('profile-name').innerText = session.name || name;
            document.getElementById('profile-email').innerText = session.email;
            document.getElementById('profile-role').innerText = session.role;
            document.getElementById('profile-avatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=1D3461&color=fff&size=128`;
        }

        document.getElementById('form-change-password').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertEl = document.getElementById('pw-alert');
            const btn = document.getElementById('btn-change-pw');
            const currentPw = document.getElementById('pw-current').value;
            const newPw = document.getElementById('pw-new').value;
            const confirmPw = document.getElementById('pw-confirm').value;

            alertEl.className = 'hidden px-4 py-3 rounded text-sm font-medium';

            if (newPw !== confirmPw) {
                alertEl.className = 'px-4 py-3 rounded text-sm font-medium';
                alertEl.style.cssText = 'border-radius:4px;background:#FEF2F2;color:#991B1B;border:1px solid #FECACA;';
                alertEl.innerText = 'New passwords do not match.';
                return;
            }

            btn.innerText = 'Updating...';
            btn.disabled = true;

            try {
                const token = localStorage.getItem('aura_token');
                const res = await fetch(`${API_BASE}/auth/change-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ currentPassword: currentPw, newPassword: newPw })
                });
                const data = await res.json();

                if (data.success) {
                    alertEl.className = 'px-4 py-3 rounded text-sm font-medium';
                    alertEl.style.cssText = 'border-radius:4px;background:#F0FDF4;color:#166534;border:1px solid #BBF7D0;';
                    alertEl.innerText = 'Password updated successfully!';
                    document.getElementById('form-change-password').reset();
                } else {
                    alertEl.className = 'px-4 py-3 rounded text-sm font-medium';
                    alertEl.style.cssText = 'border-radius:4px;background:#FEF2F2;color:#991B1B;border:1px solid #FECACA;';
                    alertEl.innerText = data.message || 'Failed to update password.';
                }
            } catch (err) {
                alertEl.className = 'px-4 py-3 rounded text-sm font-medium';
                alertEl.style.cssText = 'border-radius:4px;background:#FEF2F2;color:#991B1B;border:1px solid #FECACA;';
                alertEl.innerText = 'Network error. Please try again.';
            } finally {
                btn.innerText = 'Update Password';
                btn.disabled = false;
            }
        });

        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
