<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraExam - Portal Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-enter { opacity: 0; transform: translateY(10px); }
        .fade-enter-active { opacity: 1; transform: translateY(0); transition: opacity 300ms, transform 300ms; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden relative" id="app-container">
        <div class="bg-blue-700 p-6 text-center">
            <h1 class="text-2xl font-bold text-white tracking-wide">AuraExam</h1>
            <p class="text-blue-100 text-sm mt-1">Secure Assessment Portal</p>
        </div>

        <div class="p-8">
            <!-- Tabs -->
            <div class="flex mb-6 bg-slate-100 p-1 rounded-lg">
                <button id="tab-login" class="flex-1 py-2 text-sm font-medium rounded-md bg-white shadow-sm text-blue-700 transition-all">Login</button>
                <button id="tab-register" class="flex-1 py-2 text-sm font-medium rounded-md text-slate-500 hover:text-slate-700 transition-all">Register</button>
            </div>

            <!-- Message Box -->
            <div id="message-box" class="hidden mb-4 p-3 rounded-lg text-sm text-center font-medium"></div>

            <!-- LOGIN FORM (Automatic RBAC) -->
            <form id="form-login" class="space-y-4 fade-enter-active">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1" for="login-email">Email Address</label>
                    <input type="email" id="login-email" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors" placeholder="user@university.edu">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-sm font-medium text-slate-700" for="login-password">Password</label>
                        <a href="#" class="text-xs text-blue-600 hover:underline">Forgot Password?</a>
                    </div>
                    <input type="password" id="login-password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-blue-700 text-white font-medium py-2.5 rounded-lg hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 transition-all mt-4">
                    Secure Login
                </button>
            </form>

            <!-- REGISTER FORM (Roles still needed for creation) -->
            <form id="form-register" class="hidden space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1" for="reg-role">Register As</label>
                    <select id="reg-role" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white text-slate-700">
                        <option value="" disabled selected>Select your role</option>
                        <option value="student">Student</option>
                        <option value="lecturer">Teacher / Lecturer</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1" for="reg-name">Full Name</label>
                    <input type="text" id="reg-name" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors" placeholder="John Doe">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1" for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors" placeholder="user@university.edu">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1" for="reg-password">Password</label>
                        <input type="password" id="reg-password" required minlength="8" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors" placeholder="••••••••">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1" for="reg-confirm">Confirm</label>
                        <input type="password" id="reg-confirm" required minlength="8" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors" placeholder="••••••••">
                    </div>
                </div>
                <button type="submit" class="w-full bg-slate-800 text-white font-medium py-2.5 rounded-lg hover:bg-slate-900 focus:ring-4 focus:ring-slate-300 transition-all mt-4">
                    Create Account
                </button>
            </form>
        </div>

        <!-- Redirect Overlay -->
        <div id="redirect-overlay" class="hidden absolute inset-0 bg-white/90 backdrop-blur-sm flex flex-col items-center justify-center z-20">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-700 mb-4"></div>
            <h2 id="redirect-text" class="text-xl font-bold text-slate-800">Verifying Identity...</h2>
            <p id="redirect-url" class="text-sm text-slate-500 mt-2 font-mono"></p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../services/auth.service.js"></script>
    <script src="../views/auth.view.js"></script>
    <script src="../controllers/auth.controller.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => { AuthController.init(); });
    </script>
</body>
</html>
