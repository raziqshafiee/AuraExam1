<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraExam - My Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Plus Jakarta Sans','system-ui','sans-serif']}}}}</script>
    <script src="/src/utils/security.js"></script>
    <script src="/src/services/exam.service.js"></script>
    <script src="/src/services/note.service.js"></script>
    <script src="/src/utils/notification-bell.js"></script>
    <script>
        if (typeof SecurityGuard !== 'undefined') SecurityGuard.protectPage('student');
        function logout() { if (typeof SecurityGuard !== 'undefined') SecurityGuard.logout(); }
    </script>
</head>
<body class="flex h-screen overflow-hidden font-sans" style="background:#F8F7F4;color:#111111;">

    <!-- Sidebar -->
    <aside class="w-64 flex flex-col hidden md:flex flex-shrink-0" style="background:#111111;">
        <div class="h-16 flex items-center px-4" style="border-bottom:1px solid rgba(255,255,255,0.07);">
            <img src="/src/assets/logo.png" alt="AuraExam" class="h-8 w-auto">
        </div>
        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-0.5">
            <a href="/src/views/student-dashboard.html" class="flex items-center px-3 py-2.5 text-sm font-medium rounded transition-colors" style="color:rgba(255,255,255,0.5);" onmouseover="this.style.background='rgba(255,255,255,0.07)';this.style.color='#fff'" onmouseout="this.style.background='transparent';this.style.color='rgba(255,255,255,0.5)'">
                <svg class="w-4 h-4 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                Dashboard
            </a>
            <a href="/src/views/student-exams.html" class="flex items-center px-3 py-2.5 text-sm font-medium rounded transition-colors" style="color:rgba(255,255,255,0.5);" onmouseover="this.style.background='rgba(255,255,255,0.07)';this.style.color='#fff'" onmouseout="this.style.background='transparent';this.style.color='rgba(255,255,255,0.5)'">
                <svg class="w-4 h-4 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                My Exams
            </a>
            <a href="/src/views/student-grades.html" class="flex items-center px-3 py-2.5 text-sm font-medium rounded transition-colors" style="color:rgba(255,255,255,0.5);" onmouseover="this.style.background='rgba(255,255,255,0.07)';this.style.color='#fff'" onmouseout="this.style.background='transparent';this.style.color='rgba(255,255,255,0.5)'">
                <svg class="w-4 h-4 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                My Grades
            </a>
            <a href="/src/views/student-profile.html" class="flex items-center px-3 py-2.5 text-sm font-medium rounded transition-colors" style="color:rgba(255,255,255,0.5);" onmouseover="this.style.background='rgba(255,255,255,0.07)';this.style.color='#fff'" onmouseout="this.style.background='transparent';this.style.color='rgba(255,255,255,0.5)'">
                <svg class="w-4 h-4 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                My Profile
            </a>
            <a href="/src/views/student-notes.html" class="flex items-center px-3 py-2.5 text-sm font-semibold text-white rounded" style="background:rgba(255,255,255,0.1);">
                <svg class="w-4 h-4 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                My Notes
            </a>
        </nav>
        <div class="p-3" style="border-top:1px solid rgba(255,255,255,0.07);">
            <button onclick="logout()" class="flex items-center w-full px-3 py-2.5 text-sm font-medium rounded transition-colors" style="color:rgba(255,255,255,0.4);background:transparent;border:none;cursor:pointer;" onmouseover="this.style.background='rgba(255,255,255,0.07)';this.style.color='#fca5a5'" onmouseout="this.style.background='transparent';this.style.color='rgba(255,255,255,0.4)'">
                <svg class="w-4 h-4 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Log Out
            </button>
        </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <header class="h-16 flex items-center justify-between px-8 flex-shrink-0" style="background:#fff;border-bottom:1px solid #E5E1DA;">
            <h2 class="text-sm font-bold uppercase tracking-widest" style="color:#8A8A8A;">My Notes</h2>
            <div class="flex items-center gap-3">
                <!-- Notification Bell -->
                <div class="relative">
                    <button id="bell-btn" onclick="toggleBellDropdown()" class="relative w-9 h-9 flex items-center justify-center rounded-full transition-colors" style="background:transparent;border:none;cursor:pointer;" onmouseover="this.style.background='#F8F7F4'" onmouseout="this.style.background='transparent'">
                        <svg class="w-5 h-5" style="color:#8A8A8A;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                        <span id="bell-badge" class="hidden absolute top-1 right-1 w-4 h-4 text-[10px] font-bold text-white flex items-center justify-center rounded-full" style="background:#DC2626;"></span>
                    </button>
                    <div id="bell-dropdown" class="hidden absolute right-0 mt-1 w-80 bg-white rounded-lg shadow-xl z-50" style="border:1px solid #E5E1DA;top:100%;"></div>
                </div>
                <div class="text-right hidden sm:block">
                    <p id="user-name-display" class="text-sm font-bold leading-tight" style="color:#111111;">Loading...</p>
                    <p class="text-xs" style="color:#8A8A8A;">Student Portal</p>
                </div>
                <img id="user-avatar" class="w-9 h-9 rounded-full" style="border:2px solid #E5E1DA;" src="https://ui-avatars.com/api/?name=Student&background=1D3461&color=fff" alt="Avatar">
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-8" style="background:#F8F7F4;">
            <div class="mb-8">
                <h1 class="text-2xl font-bold leading-tight" style="color:#111111;">Class Notes & Announcements</h1>
                <p class="text-sm mt-1" style="color:#8A8A8A;">Notes and announcements posted by your lecturers, grouped by class.</p>
            </div>

            <div id="notes-container">
                <div class="py-12 text-center">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 mx-auto mb-3" style="border-color:#1D3461;"></div>
                    <p class="text-sm" style="color:#8A8A8A;">Loading notes...</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof SecurityGuard !== 'undefined') {
                const session = SecurityGuard.getSession();
                if (session) {
                    document.getElementById('user-name-display').textContent = session.name || session.email.split('@')[0];
                    document.getElementById('user-avatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(session.name || session.email)}&background=1D3461&color=fff`;
                }
            }

            if (typeof initNotificationBell !== 'undefined') initNotificationBell();
            await loadNotes();
        });

        async function loadNotes() {
            const container = document.getElementById('notes-container');
            if (typeof ExamService === 'undefined') {
                container.innerHTML = `<p class="text-sm" style="color:#8A8A8A;">Could not load class list.</p>`;
                return;
            }

            const classRes = await ExamService.getStudentClasses();
            if (!classRes.success || !classRes.data.length) {
                container.innerHTML = emptyState('You have no enrolled classes.');
                return;
            }

            const results = await Promise.all(
                classRes.data.map(cls =>
                    NoteService.getClassNotes(cls._id).then(r => ({ cls, notes: r.success ? r.data : [] }))
                )
            );

            const withNotes = results.filter(r => r.notes.length > 0);
            if (!withNotes.length) {
                container.innerHTML = emptyState('No notes from your lecturers yet.');
                return;
            }

            container.innerHTML = withNotes.map(({ cls, notes }) => `
                <div class="mb-10">
                    <h3 class="text-xs font-bold uppercase tracking-widest mb-4 flex items-center gap-2" style="color:#8A8A8A;">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                        ${escHtml(cls.className)}
                        <span class="font-medium normal-case tracking-normal" style="color:#8A8A8A;">&mdash; ${notes.length} note${notes.length !== 1 ? 's' : ''}</span>
                    </h3>
                    <div class="space-y-3">
                        ${notes.map(note => renderNote(note)).join('')}
                    </div>
                </div>
            `).join('');
        }

        const FILE_TYPE_COLORS = {
            pdf:'#DC2626',doc:'#2563EB',docx:'#2563EB',ppt:'#D97706',pptx:'#D97706',
            xls:'#059669',xlsx:'#059669',mp4:'#7C3AED',webm:'#7C3AED',mov:'#7C3AED',
            avi:'#7C3AED',mp3:'#9D174D',wav:'#9D174D',ogg:'#9D174D',
            jpg:'#0284C7',jpeg:'#0284C7',png:'#0284C7',gif:'#0284C7',webp:'#0284C7',
            zip:'#B45309',txt:'#374151'
        };
        const FILE_TYPE_LABELS = {
            pdf:'PDF',doc:'DOC',docx:'DOC',ppt:'PPT',pptx:'PPT',xls:'XLS',xlsx:'XLS',
            mp4:'VIDEO',webm:'VIDEO',mov:'VIDEO',avi:'VIDEO',mp3:'AUDIO',wav:'AUDIO',ogg:'AUDIO',
            jpg:'IMAGE',jpeg:'IMAGE',png:'IMAGE',gif:'IMAGE',webp:'IMAGE',zip:'ZIP',txt:'TXT'
        };

        function renderNote(note) {
            const dateStr = new Date(note.createdAt).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });

            let attachmentHtml = '';
            if (note.attachmentUrl) {
                const ext   = (note.attachmentName || note.attachmentUrl).split('.').pop().toLowerCase();
                const label = FILE_TYPE_LABELS[ext] || ext.toUpperCase().slice(0,4) || 'FILE';
                const color = FILE_TYPE_COLORS[ext] || '#8A8A8A';
                attachmentHtml = `
                    <a href="${escHtml(note.attachmentUrl)}" target="_blank" rel="noopener"
                       class="flex items-center gap-2 text-xs font-bold px-3 py-1.5 rounded transition-colors"
                       style="background:#F8F7F4;color:#1D3461;border:1px solid #E5E1DA;text-decoration:none;"
                       onmouseover="this.style.background='#EEF0F6'" onmouseout="this.style.background='#F8F7F4'">
                        <span class="text-[9px] font-black px-1.5 py-0.5 rounded text-white" style="background:${color};">${label}</span>
                        ${escHtml(note.attachmentName || 'Open attachment')}
                    </a>`;
            } else {
                attachmentHtml = `
                    <button onclick="NoteService.downloadNote('${note._id}')"
                            class="flex items-center gap-1.5 text-xs font-bold px-3 py-1.5 rounded transition-colors"
                            style="background:#F8F7F4;color:#1D3461;border:1px solid #E5E1DA;cursor:pointer;"
                            onmouseover="this.style.background='#EEF0F6'" onmouseout="this.style.background='#F8F7F4'">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Download .txt
                    </button>`;
            }

            return `
            <div class="bg-white rounded p-5" style="border:1px solid #E5E1DA;border-left:3px solid #1D3461;">
                <div class="flex items-start justify-between gap-4 mb-3">
                    <h4 class="font-bold text-sm leading-snug" style="color:#111111;">${escHtml(note.title)}</h4>
                    <span class="text-[10px] whitespace-nowrap flex-shrink-0" style="color:#8A8A8A;">${dateStr}</span>
                </div>
                ${note.body ? `<p class="text-sm leading-relaxed mb-4" style="color:#525252;">${escHtml(note.body)}</p>` : ''}
                <div class="flex items-center justify-between">
                    <p class="text-[10px] font-semibold uppercase tracking-widest" style="color:#8A8A8A;">
                        Posted by ${escHtml(note.authorId)}
                    </p>
                    ${attachmentHtml}
                </div>
            </div>`;
        }

        function emptyState(msg) {
            return `
            <div class="py-16 text-center rounded" style="border:2px dashed #E5E1DA;">
                <svg class="w-10 h-10 mx-auto mb-3" style="color:#E5E1DA;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                <p class="text-sm font-medium" style="color:#8A8A8A;">${msg}</p>
            </div>`;
        }

        function escHtml(str) {
            if (!str) return '';
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }
    </script>
</body>
</html>
