<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraExam - My Exams</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Plus Jakarta Sans','system-ui','sans-serif']}}}}</script>
    <script src="/src/utils/security.js"></script>
    <script src="/src/services/exam.service.js"></script>
    <script src="/src/utils/notification-bell.js"></script>
    <script>
        if (typeof SecurityGuard !== 'undefined') SecurityGuard.protectPage('student');
        function logout() { if (typeof SecurityGuard !== 'undefined') SecurityGuard.logout(); }
    </script>
</head>
<body class="flex h-screen overflow-hidden font-sans" style="background:#F8F7F4;color:#111111;">

    <!-- Sidebar -->
    <aside class="w-64 flex flex-col hidden md:flex flex-shrink-0" style="background:#111111;">
        <div class="h-16 flex items-center px-4" style="border-bottom:1px solid rgba(255,255,255,0.07);">
            <img src="/src/assets/logo.png" alt="AuraExam" class="h-8 w-auto">
        </div>

        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-0.5">
            <a href="/src/views/student-dashboard.html" class="flex items-center px-3 py-2.5 text-sm font-medium rounded transition-colors" style="color:rgba(255,255,255,0.5);" onmouseover="this.style.background='rgba(255,255,255,0.07)';this.style.color='#fff'" onmouseout="this.style.background='transparent';this.style.color='rgba(255,255,255,0.5)'">
                <svg class="w-4 h-4 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                Dashboard
            </a>
            <a href="/src/views/student-exams.html" class="flex items-center px-3 py-2.5 text-sm font-semibold text-white rounded transition-colors" style="background:rgba(255,255,255,0.1);">
                <svg class="w-4 h-4 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                My Exams
            </a>
            <a href="/src/views/student-grades.html" class="flex items-center px-3 py-2.5 text-sm font-medium rounded transition-colors" style="color:rgba(255,255,255,0.5);" onmouseover="this.style.background='rgba(255,255,255,0.07)';this.style.color='#fff'" onmouseout="this.style.background='transparent';this.style.color='rgba(255,255,255,0.5)'">
                <svg class="w-4 h-4 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                My Grades
            </a>
            <a href="/src/views/student-profile.html" class="flex items-center px-3 py-2.5 text-sm font-medium rounded transition-colors" style="color:rgba(255,255,255,0.5);" onmouseover="this.style.background='rgba(255,255,255,0.07)';this.style.color='#fff'" onmouseout="this.style.background='transparent';this.style.color='rgba(255,255,255,0.5)'">
                <svg class="w-4 h-4 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                My Profile
            </a>
            <a href="/src/views/student-notes.html" class="flex items-center px-3 py-2.5 text-sm font-medium rounded transition-colors" style="color:rgba(255,255,255,0.5);" onmouseover="this.style.background='rgba(255,255,255,0.07)';this.style.color='#fff'" onmouseout="this.style.background='transparent';this.style.color='rgba(255,255,255,0.5)'">
                <svg class="w-4 h-4 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                My Notes
            </a>
        </nav>

        <div class="p-3" style="border-top:1px solid rgba(255,255,255,0.07);">
            <button onclick="logout()" class="flex items-center w-full px-3 py-2.5 text-sm font-medium rounded transition-colors" style="color:rgba(255,255,255,0.4);" onmouseover="this.style.background='rgba(255,255,255,0.07)';this.style.color='#fca5a5'" onmouseout="this.style.background='transparent';this.style.color='rgba(255,255,255,0.4)'">
                <svg class="w-4 h-4 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Log Out
            </button>
        </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <header class="h-16 flex items-center justify-between px-8 flex-shrink-0" style="background:#fff;border-bottom:1px solid #E5E1DA;">
            <h2 class="text-sm font-bold uppercase tracking-widest" style="color:#8A8A8A;">My Exams</h2>
            <div class="flex items-center gap-3">
                <div class="relative">
                    <button id="bell-btn" onclick="toggleBellDropdown()" class="relative w-9 h-9 flex items-center justify-center rounded-full transition-colors" style="background:transparent;border:none;cursor:pointer;" onmouseover="this.style.background='#F8F7F4'" onmouseout="this.style.background='transparent'">
                        <svg class="w-5 h-5" style="color:#8A8A8A;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                        <span id="bell-badge" class="hidden absolute top-1 right-1 w-4 h-4 text-[10px] font-bold text-white flex items-center justify-center rounded-full" style="background:#DC2626;"></span>
                    </button>
                    <div id="bell-dropdown" class="hidden absolute right-0 mt-1 w-80 bg-white rounded-lg shadow-xl z-50" style="border:1px solid #E5E1DA;top:100%;"></div>
                </div>
                <div class="text-right hidden sm:block">
                    <p id="user-name-display" class="text-sm font-bold leading-tight" style="color:#111111;">Student</p>
                    <p class="text-xs" style="color:#8A8A8A;">AuraExam Portal</p>
                </div>
                <img id="user-avatar" class="w-9 h-9 rounded-full" style="border:2px solid #E5E1DA;" src="https://ui-avatars.com/api/?name=Student&background=1D3461&color=fff" alt="User Avatar">
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-8" style="background:#F8F7F4;">
            <div class="mb-8">
                <h1 class="text-2xl font-bold leading-tight" style="color:#111111;">Exam Schedule</h1>
                <p class="mt-1 text-sm" style="color:#8A8A8A;">Assessments will unlock automatically at their scheduled start time.</p>
            </div>

            <div id="exams-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="col-span-full flex flex-col items-center justify-center py-12">
                    <div class="animate-spin rounded-full h-10 w-10 border-b-2 mb-4" style="border-color:#1D3461;"></div>
                    <p class="text-sm font-medium" style="color:#8A8A8A;">Syncing with database...</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('exams-container');

            if (typeof SecurityGuard === 'undefined' || typeof ExamService === 'undefined') {
                container.innerHTML = `<div class="col-span-full p-4 rounded text-sm font-medium" style="background:#FEF2F2;color:#991B1B;border:1px solid #FECACA;">Critical Error: Services not found.</div>`;
                return;
            }

            const userSession = SecurityGuard.getSession();
            if (userSession && userSession.email) {
                document.getElementById('user-name-display').textContent = userSession.email.split('@')[0];
                document.getElementById('user-avatar').src = `https://ui-avatars.com/api/?name=${userSession.email}&background=1D3461&color=fff`;
            }

            if (typeof initNotificationBell !== 'undefined') initNotificationBell();

            const [examsResponse, subsResponse] = await Promise.all([
                ExamService.getStudentExams(),
                ExamService.getStudentSubmissions()
            ]);

            if (!examsResponse.success) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-sm" style="color:#8A8A8A;">No exams found. Make sure you are enrolled in a class.</div>`;
                return;
            }

            const exams = examsResponse.data;
            const submissions = subsResponse.success ? subsResponse.data : [];
            const now = new Date();

            container.innerHTML = exams.map(exam => {
                const startTime = new Date(exam.startTime || exam.scheduledDate);
                const endTime   = new Date(exam.endTime || startTime.getTime() + (exam.durationMinutes * 60000));

                const submission    = submissions.find(sub => sub.examId === exam._id);
                const hasSubmitted  = !!submission;
                const isTimeReady   = now >= startTime && now <= endTime;
                const isPastDue     = now > endTime;
                const isActiveManual  = exam.status === 'active';
                const isClosedManual  = exam.status === 'completed';

                let statusLabel = 'Scheduled';
                let statusStyle = 'background:#F1F5F9;color:#475569;border:1px solid #E5E1DA;';
                let canStart = false;

                if (hasSubmitted) {
                    statusLabel = 'Submitted';
                    statusStyle = 'background:#D1FAE5;color:#065F46;border:1px solid #A7F3D0;';
                } else if (isPastDue || isClosedManual) {
                    statusLabel = 'Missed';
                    statusStyle = 'background:#FEE2E2;color:#991B1B;border:1px solid #FECACA;';
                } else if (isTimeReady || isActiveManual) {
                    statusLabel = 'Pending';
                    statusStyle = 'background:#FEF3C7;color:#92400E;border:1px solid #FDE68A;';
                    canStart = true;
                }

                let scoreHtml = '';
                if (hasSubmitted && submission) {
                    const scoreColor = submission.percentage >= 50 ? 'color:#059669;' : 'color:#DC2626;';
                    scoreHtml = `
                    <div class="flex justify-between text-xs pt-2 mt-2" style="border-top:1px solid #E5E1DA;">
                        <span class="font-bold uppercase tracking-wider" style="color:#8A8A8A;">Your Score:</span>
                        <span class="font-black" style="${scoreColor}">${submission.score} / ${submission.totalQuestions} (${submission.percentage}%)</span>
                    </div>`;
                } else {
                    scoreHtml = `
                    <div class="flex justify-between text-xs">
                        <span style="color:#8A8A8A;">Timer Limit:</span>
                        <span class="font-bold" style="color:#111111;">${exam.durationMinutes} Minutes</span>
                    </div>`;
                }

                let btnHtml = '';
                if (hasSubmitted) {
                    btnHtml = `<button onclick="window.location.href='/src/views/student-take-exam.html?id=${exam._id}'" class="w-full py-3 text-white font-bold rounded transition-colors" style="background:#1D3461;border:none;cursor:pointer;" onmouseover="this.style.background='#111111'" onmouseout="this.style.background='#1D3461'">View Results & Review</button>`;
                } else if (isPastDue || isClosedManual) {
                    btnHtml = `<button onclick="window.location.href='/src/views/student-take-exam.html?id=${exam._id}'" class="w-full py-3 font-bold rounded transition-colors" style="background:#F8F7F4;color:#525252;border:1px solid #E5E1DA;cursor:pointer;" onmouseover="this.style.background='#E5E1DA'" onmouseout="this.style.background='#F8F7F4'">View Details (Missed)</button>`;
                } else if (canStart) {
                    btnHtml = `<button onclick="window.location.href='/src/views/student-take-exam.html?id=${exam._id}'" class="w-full py-3 text-white font-bold rounded transition-colors" style="background:#059669;border:none;cursor:pointer;" onmouseover="this.style.background='#047857'" onmouseout="this.style.background='#059669'">Start Assessment</button>`;
                } else {
                    btnHtml = `<button disabled class="w-full py-3 font-bold rounded" style="background:#F8F7F4;color:#8A8A8A;border:1px solid #E5E1DA;cursor:not-allowed;">Locked</button>`;
                }

                return `
                <div class="bg-white rounded p-6 flex flex-col transition-colors" style="border:1px solid #E5E1DA;" onmouseover="this.style.borderColor='#1D3461'" onmouseout="this.style.borderColor='#E5E1DA'">
                    <div class="flex justify-between items-start mb-4">
                        <div class="w-10 h-10 rounded flex items-center justify-center" style="background:#EEF0F6;color:#1D3461;">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                        </div>
                        <span class="px-2.5 py-1 text-[10px] font-bold rounded-full uppercase tracking-wider" style="${statusStyle}">${statusLabel}</span>
                    </div>

                    <h3 class="font-bold mb-1" style="color:#111111;">${exam.courseName}</h3>
                    <p class="text-sm mb-4 flex-1 font-medium" style="color:#8A8A8A;">${exam.title}</p>

                    <div class="rounded p-3 space-y-2 mb-6" style="background:#F8F7F4;border:1px solid #E5E1DA;">
                        <div class="flex justify-between text-xs">
                            <span style="color:#8A8A8A;">Available:</span>
                            <span class="font-bold" style="color:#111111;">${startTime.toLocaleString([], {month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'})}</span>
                        </div>
                        <div class="flex justify-between text-xs">
                            <span style="color:#8A8A8A;">Due By:</span>
                            <span class="font-bold" style="color:#DC2626;">${endTime.toLocaleString([], {month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'})}</span>
                        </div>
                        ${scoreHtml}
                    </div>

                    ${btnHtml}
                </div>
                `;
            }).join('');
        });
    </script>
</body>
</html>
