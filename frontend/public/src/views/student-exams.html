<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraExam - My Exams</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/src/utils/security.js"></script>
    <script src="/src/services/exam.service.js"></script>
    <script>
        if (typeof SecurityGuard !== 'undefined') SecurityGuard.protectPage('student');
        function logout() { if (typeof SecurityGuard !== 'undefined') SecurityGuard.logout(); }
    </script>
</head>
<body class="bg-slate-50 flex h-screen overflow-hidden font-sans text-slate-800">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-slate-200 flex-col hidden md:flex transition-all duration-300">
        <div class="h-16 flex items-center px-6 border-b border-slate-100">
            <div class="w-8 h-8 bg-blue-700 rounded-lg flex items-center justify-center mr-3">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            </div>
            <span class="font-bold text-xl text-blue-900 tracking-tight">AuraExam</span>
        </div>

        <nav class="flex-1 overflow-y-auto py-6 px-4 space-y-1">
            <a href="/student-dashboard.html" class="flex items-center px-3 py-2 text-sm font-medium text-slate-600 rounded-lg hover:bg-slate-50 hover:text-slate-900 transition-colors group">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                Dashboard
            </a>
            <a href="/student-exams.html" class="flex items-center px-3 py-2 text-sm font-semibold text-blue-700 bg-blue-50 rounded-lg transition-colors group">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                My Exams
            </a>
        </nav>

        <div class="p-4 border-t border-slate-100">
            <button onclick="logout()" class="flex items-center w-full px-3 py-2 text-sm font-medium text-red-600 rounded-lg hover:bg-red-50 transition-colors">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Log Out
            </button>
        </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 z-10">
            <h2 class="text-lg font-bold text-slate-800">My Exams</h2>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-3 pl-4 border-l border-slate-200">
                    <div class="text-right hidden sm:block">
                        <p id="user-name-display" class="text-sm font-bold text-slate-800 leading-tight">Student</p>
                        <p class="text-xs text-slate-500">AuraExam Portal</p>
                    </div>
                    <img id="user-avatar" class="w-10 h-10 rounded-full border border-slate-200" src="https://ui-avatars.com/api/?name=Student&background=6366f1&color=fff" alt="User Avatar">
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-8">
            <div class="mb-8">
                <h1 class="text-2xl font-bold text-slate-900 leading-tight">Exam Schedule</h1>
                <p class="text-slate-500 mt-1 text-sm">Assessments will unlock automatically at their scheduled start time.</p>
            </div>

            <div id="exams-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="col-span-full flex flex-col items-center justify-center py-12">
                    <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-700 mb-4"></div>
                    <p class="text-slate-500 font-medium">Syncing with database...</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('exams-container');
            
            if (typeof SecurityGuard === 'undefined' || typeof ExamService === 'undefined') {
                container.innerHTML = `<div class="col-span-full bg-red-50 text-red-600 p-4 rounded-lg border border-red-200">Critical Error: Services not found.</div>`;
                return;
            }

            const userSession = SecurityGuard.getSession();
            if (userSession && userSession.email) {
                document.getElementById('user-name-display').textContent = userSession.email.split('@')[0];
                document.getElementById('user-avatar').src = `https://ui-avatars.com/api/?name=${userSession.email}&background=6366f1&color=fff`;
            }

            // Fetch both exams AND student submissions in parallel
            const [examsResponse, subsResponse] = await Promise.all([
                ExamService.getStudentExams(),
                ExamService.getStudentSubmissions()
            ]);

            if (!examsResponse.success) {
                container.innerHTML = `<div class="col-span-full text-center py-12">No exams found. Make sure you are enrolled in a class.</div>`;
                return;
            }

            const exams = examsResponse.data;
            const submissions = subsResponse.success ? subsResponse.data : [];
            const now = new Date();

            container.innerHTML = exams.map(exam => {
                const startTime = new Date(exam.startTime || exam.scheduledDate);
                const endTime   = new Date(exam.endTime || startTime.getTime() + (exam.durationMinutes * 60000));
                
                const submission    = submissions.find(sub => sub.examId === exam._id);
                const hasSubmitted  = !!submission;
                const isTimeReady   = now >= startTime && now <= endTime;
                const isPastDue     = now > endTime;
                const isActiveManual  = exam.status === 'active';
                const isClosedManual  = exam.status === 'completed';

                // ── Status label & colour ──
                let statusLabel = 'Scheduled';
                let statusColor = 'bg-slate-100 text-slate-600 border border-slate-200';
                let canStart = false;

                if (hasSubmitted) {
                    // Submitted always wins, regardless of timing
                    statusLabel = 'Submitted';
                    statusColor = 'bg-green-100 text-green-800 border border-green-300';
                } else if (isPastDue || isClosedManual) {
                    // Past due and never answered
                    statusLabel = 'Missed';
                    statusColor = 'bg-red-100 text-red-700 border border-red-200';
                } else if (isTimeReady || isActiveManual) {
                    statusLabel = 'Pending';
                    statusColor = 'bg-amber-100 text-amber-700 border border-amber-300 animate-pulse';
                    canStart = true;
                }

                // ── Score area ──
                let scoreHtml = '';
                if (hasSubmitted && submission) {
                    const scoreColor = submission.percentage >= 50 ? 'text-green-600' : 'text-red-600';
                    scoreHtml = `
                    <div class="flex justify-between text-xs pt-2 border-t border-slate-200 mt-2">
                        <span class="text-slate-500 font-bold uppercase tracking-wider">Your Score:</span>
                        <span class="font-black ${scoreColor}">${submission.score} / ${submission.totalQuestions} (${submission.percentage}%)</span>
                    </div>`;
                } else {
                    scoreHtml = `
                    <div class="flex justify-between text-xs">
                        <span class="text-slate-400">Timer Limit:</span>
                        <span class="font-bold text-slate-700">${exam.durationMinutes} Minutes</span>
                    </div>`;
                }

                // ── Button ──
                let btnHtml = '';
                if (hasSubmitted) {
                    // Can always review a submitted exam
                    btnHtml = `<button onclick="window.location.href='/student-take-exam.html?id=${exam._id}'" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white shadow-md active:scale-95 font-bold rounded-xl transition-all">View Results & Review</button>`;
                } else if (isPastDue || isClosedManual) {
                    // Missed — still links to the page, which will show the "missed" UI
                    btnHtml = `<button onclick="window.location.href='/student-take-exam.html?id=${exam._id}'" class="w-full py-3 bg-slate-500 hover:bg-slate-600 text-white shadow-md active:scale-95 font-bold rounded-xl transition-all">View Details (Missed)</button>`;
                } else if (canStart) {
                    btnHtml = `<button onclick="window.location.href='/student-take-exam.html?id=${exam._id}'" class="w-full py-3 bg-blue-700 hover:bg-blue-800 text-white shadow-blue-200 shadow-md active:scale-95 font-bold rounded-xl transition-all">Start Assessment</button>`;
                } else {
                    btnHtml = `<button disabled class="w-full py-3 bg-slate-100 text-slate-400 cursor-not-allowed font-bold rounded-xl transition-all">Locked</button>`;
                }

                return `
                <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm hover:shadow-md transition-all flex flex-col">
                    <div class="flex justify-between items-start mb-4">
                        <div class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-lg flex items-center justify-center">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                        </div>
                        <span class="px-2.5 py-1 ${statusColor} text-[10px] font-bold rounded-full uppercase tracking-wider">
                            ${statusLabel}
                        </span>
                    </div>
                    
                    <h3 class="font-bold text-slate-900 mb-1">${exam.courseName}</h3>
                    <p class="text-sm text-slate-500 mb-4 flex-1 font-medium">${exam.title}</p>
                    
                    <div class="bg-slate-50 rounded-lg p-3 space-y-2 mb-6 border border-slate-100 flex-col flex justify-center">
                        <div class="flex justify-between text-xs">
                            <span class="text-slate-400">Available:</span>
                            <span class="font-bold text-slate-700">${startTime.toLocaleString([], {month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'})}</span>
                        </div>
                        <div class="flex justify-between text-xs">
                            <span class="text-slate-400">Due By:</span>
                            <span class="font-bold text-red-600">${endTime.toLocaleString([], {month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'})}</span>
                        </div>
                        ${scoreHtml}
                    </div>
                    
                    ${btnHtml}
                </div>
                `;
            }).join('');
        });
    </script>
</body>
</html>
